<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles.css">
    <title>Patrimonio Neto</title>
    <style>
        .patrimonio-section {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin: 8px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .patrimonio-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        .patrimonio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .patrimonio-item input[type="number"] {
            width: 90px;
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            text-align: right;
        }
        .patrimonio-item button {
            background: none;
            border: none;
            color: #c62828;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-agregar {
            width: 100%;
            padding: 8px;
            background: none;
            border: 1px dashed #4caf50;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            color: #2e7d32;
            font-weight: 500;
        }
        .btn-agregar.danger {
            border-color: #c62828;
            color: #c62828;
        }
        .patrimonio-resumen {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 8px 16px;
        }
        .patrimonio-resumen .box {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .patrimonio-resumen .box.activos { background: #e8f5e9; }
        .patrimonio-resumen .box.pasivos { background: #fce4ec; }
        .patrimonio-resumen .box.patrimonio { background: #e3f2fd; }
        .patrimonio-resumen .box .label { font-size: 10px; color: #999; text-transform: uppercase; }
        .patrimonio-resumen .box .value { font-size: 18px; font-weight: 700; display: block; }
        .patrimonio-resumen .box .value.positive { color: #2e7d32; }
        .patrimonio-resumen .box .value.negative { color: #c62828; }
        .selector-mes-patrimonio {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 8px 16px;
            align-items: center;
        }
        .selector-mes-patrimonio button {
            padding: 6px 12px;
            background: #ddd;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .selector-mes-patrimonio span {
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" style="color:white; text-decoration:none; font-size:20px;">←</a>
        <h1>🏦 Patrimonio Neto</h1>
        <span class="year" id="patrimonioTotal">$0.00</span>
    </header>

    <div class="selector-mes-patrimonio">
        <button onclick="cambiarMesPatrimonio(-1)">◀</button>
        <span id="mesPatrimonioDisplay">Enero 2025</span>
        <button onclick="cambiarMesPatrimonio(1)">▶</button>
    </div>

    <div class="patrimonio-resumen" id="patrimonioResumen">
        <div class="box activos">
            <span class="label">💰 Activos</span>
            <span class="value positive" id="totalActivos">$0.00</span>
        </div>
        <div class="box pasivos">
            <span class="label">📉 Pasivos</span>
            <span class="value negative" id="totalPasivos">$0.00</span>
        </div>
        <div class="box patrimonio">
            <span class="label">📊 Patrimonio</span>
            <span class="value" id="patrimonioNeto">$0.00</span>
        </div>
    </div>

    <div class="patrimonio-section" id="activosSection">
        <h3>💰 Activos</h3>
        <div id="activosContainer"></div>
        <button class="btn-agregar" onclick="agregarActivo()">+ Agregar Activo</button>
    </div>

    <div class="patrimonio-section" id="pasivosSection">
        <h3>📉 Pasivos</h3>
        <div id="pasivosContainer"></div>
        <button class="btn-agregar danger" onclick="agregarPasivo()">+ Agregar Pasivo</button>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><span class="icon">🏠</span>Inicio</a>
        <a href="presupuesto.html"><span class="icon">📋</span>Presupuesto</a>
        <a href="transacciones.html"><span class="icon">💳</span>Gastos</a>
        <a href="dashboard.html"><span class="icon">📊</span>Dashboard</a>
        <a href="patrimonio.html" class="active"><span class="icon">🏦</span>Patrimonio</a>
    </nav>

    <script src="app.js"></script>
    <script>
        let mesPatrimonio = new Date().getMonth() + 1;
        let anioPatrimonio = new Date().getFullYear();
        let activos = [];
        let pasivos = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await window.app.abrirDB();
            const anioConfig = await window.app.obtenerConfiguracion('anio');
            if (anioConfig) anioPatrimonio = parseInt(anioConfig);
            actualizarMesDisplayPatrimonio();
            await cargarPatrimonio();
        });

        function actualizarMesDisplayPatrimonio() {
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                          'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            document.getElementById('mesPatrimonioDisplay').textContent = `${meses[mesPatrimonio - 1]} ${anioPatrimonio}`;
        }

        async function cargarPatrimonio() {
            // Para activos: mes normal, para pasivos: mes + 100 para diferenciar
            activos = await window.app.obtenerPatrimonio(mesPatrimonio);
            pasivos = await window.app.obtenerPatrimonio(mesPatrimonio + 100);
            
            renderizarActivos();
            renderizarPasivos();
            actualizarResumenPatrimonio();
        }

        function renderizarActivos() {
            const container = document.getElementById('activosContainer');
            container.innerHTML = '';
            const moneda = localStorage.getItem('moneda') || '$';
            
            if (activos.length === 0) {
                container.innerHTML = '<p style="color:#999; font-size:14px;">No hay activos registrados</p>';
                return;
            }
            
            activos.forEach(a => {
                const div = document.createElement('div');
                div.className = 'patrimonio-item';
                div.innerHTML = `
                    <span>${a.subcategoria}</span>
                    <span>
                        <input type="number" value="${a.monto}" 
                               onchange="actualizarActivo(${a.id}, this.value)">
                        <button onclick="eliminarPatrimonio(${a.id})">🗑️</button>
                    </span>
                `;
                container.appendChild(div);
            });
        }

        function renderizarPasivos() {
            const container = document.getElementById('pasivosContainer');
            container.innerHTML = '';
            
            if (pasivos.length === 0) {
                container.innerHTML = '<p style="color:#999; font-size:14px;">No hay pasivos registrados</p>';
                return;
            }
            
            pasivos.forEach(p => {
                const div = document.createElement('div');
                div.className = 'patrimonio-item';
                div.innerHTML = `
                    <span>${p.subcategoria}</span>
                    <span>
                        <input type="number" value="${p.monto}" 
                               onchange="actualizarPasivo(${p.id}, this.value)">
                        <button onclick="eliminarPatrimonio(${p.id})">🗑️</button>
                    </span>
                `;
                container.appendChild(div);
            });
        }

        function actualizarResumenPatrimonio() {
            const totalActivos = activos.reduce((sum, a) => sum + a.monto, 0);
            const totalPasivos = pasivos.reduce((sum, p) => sum + p.monto, 0);
            const patrimonio = totalActivos - totalPasivos;
            const moneda = localStorage.getItem('moneda') || '$';
            
            document.getElementById('totalActivos').textContent = window.app.formatearMoneda(totalActivos, moneda);
            document.getElementById('totalPasivos').textContent = window.app.formatearMoneda(totalPasivos, moneda);
            document.getElementById('patrimonioNeto').textContent = window.app.formatearMoneda(patrimonio, moneda);
            document.getElementById('patrimonioTotal').textContent = window.app.formatearMoneda(patrimonio, moneda);
            document.getElementById('patrimonioNeto').className = 'value ' + (patrimonio >= 0 ? 'positive' : 'negative');
        }

        async function agregarActivo() {
            const nombre = prompt('Nombre del activo (ej: Cuenta de Ahorros, Casa, etc.):');
            if (!nombre) return;
            const monto = parseFloat(prompt('Monto en ' + (localStorage.getItem('moneda') || '$') + ':'));
            if (isNaN(monto) || monto < 0) return;
            
            await window.app.guardarPatrimonio({
                mes: mesPatrimonio,
                tipo: 'ACTIVO',
                subcategoria: nombre,
                monto: monto
            });
            await cargarPatrimonio();
        }

        async function agregarPasivo() {
            const nombre = prompt('Nombre del pasivo (ej: Tarjeta de Crédito, Préstamo, etc.):');
            if (!nombre) return;
            const monto = parseFloat(prompt('Monto en ' + (localStorage.getItem('moneda') || '$') + ':'));
            if (isNaN(monto) || monto < 0) return;
            
            await window.app.guardarPatrimonio({
                mes: mesPatrimonio + 100,
                tipo: 'PASIVO',
                subcategoria: nombre,
                monto: monto
            });
            await cargarPatrimonio();
        }

        async function actualizarActivo(id, nuevoMonto) {
            const item = activos.find(a => a.id === id);
            if (item) {
                item.monto = parseFloat(nuevoMonto) || 0;
                await window.app.guardarPatrimonio({
                    mes: mesPatrimonio,
                    tipo: 'ACTIVO',
                    subcategoria: item.subcategoria,
                    monto: item.monto
                });
                await cargarPatrimonio();
            }
        }

        async function actualizarPasivo(id, nuevoMonto) {
            const item = pasivos.find(p => p.id === id);
            if (item) {
                item.monto = parseFloat(nuevoMonto) || 0;
                await window.app.guardarPatrimonio({
                    mes: mesPatrimonio + 100,
                    tipo: 'PASIVO',
                    subcategoria: item.subcategoria,
                    monto: item.monto
                });
                await cargarPatrimonio();
            }
        }

        async function eliminarPatrimonio(id) {
            if (confirm('¿Eliminar este ítem?')) {
                await window.app.eliminarPatrimonio(id);
                await cargarPatrimonio();
            }
        }

        function cambiarMesPatrimonio(delta) {
            mesPatrimonio += delta;
            if (mesPatrimonio > 12) { mesPatrimonio = 1; anioPatrimonio++; }
            if (mesPatrimonio < 1) { mesPatrimonio = 12; anioPatrimonio--; }
            actualizarMesDisplayPatrimonio();
            cargarPatrimonio();
        }
    </script>
</body>
</html>
