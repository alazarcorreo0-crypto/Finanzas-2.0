<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles.css">
    <title>Dashboard Anual</title>
    <style>
        .dashboard-container { padding: 12px 16px; }
        .dashboard-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .dashboard-card h3 {
            font-size: 14px;
            color: #777;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .dashboard-card .value {
            font-size: 24px;
            font-weight: 700;
        }
        .dashboard-card .value.positive { color: #2e7d32; }
        .dashboard-card .value.negative { color: #c62828; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .stat-item {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background: #f8f9fa;
        }
        .stat-item .label {
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
        }
        .stat-item .number {
            font-size: 18px;
            font-weight: 600;
            display: block;
        }
        .stat-item .number.income { color: #2e7d32; }
        .stat-item .number.expense { color: #c62828; }
        .stat-item .number.savings { color: #1565c0; }
        .month-row {
            display: grid;
            grid-template-columns: 70px repeat(4, 1fr);
            gap: 4px;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            align-items: center;
        }
        .month-row.header {
            font-weight: 600;
            color: #777;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 2px solid #ddd;
        }
        .month-row .month-name { font-weight: 500; }
        .month-row .amount { text-align: right; font-size: 12px; }
        .month-row .amount.income { color: #2e7d32; }
        .month-row .amount.expense { color: #c62828; }
        .month-row .amount.remanente { font-weight: 600; }
        .no-data { text-align: center; color: #999; padding: 30px 0; font-size: 14px; }
        .selector-anio {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 8px 16px;
            align-items: center;
        }
